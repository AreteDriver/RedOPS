# Alembic Configuration for RedOPS
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts
script_location = src/redops/db/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Prepend sys.path for auto-discovery
prepend_sys_path = .

# Timezone for date in migration scripts
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to true to run the environment during migration
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
sourceless = false

# Version path separator
# version_path_separator = os

# Output encoding used when writing new migration scripts
output_encoding = utf-8

# Database URL (override with DATABASE_URL env var)
sqlalchemy.url = postgresql://redops:redops@localhost:5432/redops


[post_write_hooks]
# Hooks run after new migration is generated
# Format using ruff
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
