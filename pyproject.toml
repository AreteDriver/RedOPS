[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redops"
version = "1.5.0"
description = "Advanced modular AI-assisted recon, forensics, and exposure-analysis framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "cybersecurity",
    "red-team",
    "penetration-testing",
    "osint",
    "security-assessment",
    "reconnaissance",
    "metadata-analysis",
    "threat-modeling",
    "scanner",
    "forensics"
]
authors = [
    {name = "RedOps Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
full = [
    "Pillow>=10.2.0",
    "dnspython>=2.8.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "fpdf2>=2.7.0",
    "reportlab>=4.0.0",
    "shodan>=1.31.0",
    "censys>=2.2.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "PyYAML>=6.0.0",
    "cryptography>=41.0.0",
]
ai = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.4.0",
    "groq>=1.1.2",
]
all = [
    "redops[full,ai,web]",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "pydantic[email]>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.18.4",
    "redis>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.15.15",
    "mypy>=1.20.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "myst-parser>=3.0.0",
]

[project.scripts]
redops = "redops.main:main"
redops-web = "redops.web.app:main"
redops-mcp = "redops.mcp.server:main"

[project.urls]
Homepage = "https://github.com/AreteDriver/RedOPS"
Repository = "https://github.com/AreteDriver/RedOPS"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src/redops --cov-report=term-missing:skip-covered --no-header -q"

[tool.coverage.run]
branch = true
source = ["src/redops"]
omit = [
    "src/redops/plugins/examples/*",
    "src/redops/core/cache.py",
    "src/redops/modules/notifications.py",
    "src/redops/jobs/redis_backend.py",
    # RF side-effect infra: live network client, TUI dashboard, subprocess
    # tool manager, session/hardware state, and the async event bus. Exercised
    # on hardware, not in CI (cf. the testable rf/ parsers + models, which are
    # covered by tests/test_rf_models.py and the parser tests).
    "src/redops/modules/rf/ai_client.py",
    "src/redops/modules/rf/dashboard.py",
    "src/redops/modules/rf/tool_manager.py",
    "src/redops/modules/rf/session_manager.py",
    "src/redops/modules/rf/event_bus.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
skip_covered = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
