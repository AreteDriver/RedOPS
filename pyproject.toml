[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redops"
version = "1.5.0"
description = "Advanced modular AI-assisted recon, forensics, and exposure-analysis framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = [
    "cybersecurity",
    "red-team",
    "penetration-testing",
    "osint",
    "security-assessment",
    "reconnaissance",
    "metadata-analysis",
    "threat-modeling",
    "scanner",
    "forensics"
]
authors = [
    {name = "RedOps Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
full = [
    "Pillow>=10.2.0",
    "dnspython>=2.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "fpdf2>=2.7.0",
    "shodan>=1.31.0",
    "censys>=2.2.0",
]
ai = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.4.0",
    "groq>=0.11.0",
]
all = [
    "redops[full,ai,web]",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "myst-parser>=3.0.0",
]

[project.scripts]
redops = "redops.main:main"
redops-web = "redops.web.app:main"
redops-mcp = "redops.mcp.server:main"

[project.urls]
Homepage = "https://github.com/AreteDriver/RedOPS"
Repository = "https://github.com/AreteDriver/RedOPS"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
