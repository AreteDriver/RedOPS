[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redops"
version = "1.0.0"
description = "Advanced modular AI-assisted recon, forensics, and exposure-analysis framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "RedOps Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
full = [
    "Pillow>=10.0.0",
    "dnspython>=2.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
]

[project.scripts]
redops = "redops.main:main"

[project.urls]
Homepage = "https://github.com/AreteDriver/RedOPS"
Repository = "https://github.com/AreteDriver/RedOPS"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
