name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install safety pip-audit

      - name: Run Safety check
        run: safety check --full-report
        continue-on-error: true

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true

  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (security and quality)
        run: |
          semgrep --config "p/python" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            src/ || true

      - name: Run Semgrep (output JSON artifact)
        run: |
          semgrep --config "p/python" \
            --config "p/security-audit" \
            --json --output semgrep-security.json \
            src/ || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-security-results
          path: semgrep-security.json
          if-no-files-found: ignore

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t redops:scan -f deploy/docker/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'redops:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy (JSON artifact)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'redops:scan'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          head: ${{ github.event.after || github.event.pull_request.head.sha }}
          extra_args: --only-verified

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (console output)
        run: bandit -r src/redops/ -ll || true

      - name: Run Bandit (JSON artifact)
        run: bandit -r src/redops/ -f json -o bandit-results.json -ll || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json
          if-no-files-found: ignore
