{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redops.fullname" . }}-secrets
  labels:
    {{- include "redops.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  {{- if not .Values.postgresql.external.enabled }}
  postgresql-password: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) | quote }}
  {{- else }}
  postgresql-password: {{ .Values.postgresql.external.password | quote }}
  {{- end }}

  # Redis credentials
  {{- if not .Values.redis.external.enabled }}
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 32) | quote }}
  {{- else }}
  redis-password: {{ .Values.redis.external.password | quote }}
  {{- end }}

  # Threat Intelligence API Keys
  {{- with .Values.secrets.apiKeys }}
  {{- if .greynoise }}
  GREYNOISE_API_KEY: {{ .greynoise | quote }}
  {{- end }}
  {{- if .abuseipdb }}
  ABUSEIPDB_API_KEY: {{ .abuseipdb | quote }}
  {{- end }}
  {{- if .urlscan }}
  URLSCAN_API_KEY: {{ .urlscan | quote }}
  {{- end }}
  {{- if .otx }}
  OTX_API_KEY: {{ .otx | quote }}
  {{- end }}
  {{- if .shodan }}
  SHODAN_API_KEY: {{ .shodan | quote }}
  {{- end }}
  {{- if .virustotal }}
  VIRUSTOTAL_API_KEY: {{ .virustotal | quote }}
  {{- end }}
  {{- end }}

  # SIEM Credentials
  {{- with .Values.secrets.siem }}
  {{- with .splunk }}
  {{- if .hecUrl }}
  SPLUNK_HEC_URL: {{ .hecUrl | quote }}
  {{- end }}
  {{- if .hecToken }}
  SPLUNK_HEC_TOKEN: {{ .hecToken | quote }}
  {{- end }}
  {{- end }}
  {{- with .elastic }}
  {{- if .hosts }}
  ELASTIC_HOSTS: {{ .hosts | quote }}
  {{- end }}
  {{- if .apiKey }}
  ELASTIC_API_KEY: {{ .apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- with .datadog }}
  {{- if .apiKey }}
  DD_API_KEY: {{ .apiKey | quote }}
  {{- end }}
  {{- if .site }}
  DD_SITE: {{ .site | quote }}
  {{- end }}
  {{- end }}
  {{- end }}

  # Ticketing Credentials
  {{- with .Values.secrets.ticketing }}
  {{- with .jira }}
  {{- if .baseUrl }}
  JIRA_BASE_URL: {{ .baseUrl | quote }}
  {{- end }}
  {{- if .username }}
  JIRA_USERNAME: {{ .username | quote }}
  {{- end }}
  {{- if .apiToken }}
  JIRA_API_TOKEN: {{ .apiToken | quote }}
  {{- end }}
  {{- if .projectKey }}
  JIRA_PROJECT_KEY: {{ .projectKey | quote }}
  {{- end }}
  {{- end }}
  {{- with .github }}
  {{- if .token }}
  GITHUB_TOKEN: {{ .token | quote }}
  {{- end }}
  {{- if .owner }}
  GITHUB_OWNER: {{ .owner | quote }}
  {{- end }}
  {{- if .repo }}
  GITHUB_REPO: {{ .repo | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
